spring.application.name=auth
server.port=8081

# ========================
# DataSource - MySQL
# ========================
spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:auth_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# ========================
# Redis
# ========================
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.password=${REDIS_PASSWORD:}

# ========================
# JWT
# ========================
app.jwt.secret=${JWT_SECRET:H3@lthNutrit10nTrackerSuperSecretKey!MustBe256BitsLongForHS256Algorithm}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:86400000}
app.jwt.refresh-expiration-ms=${JWT_REFRESH_EXPIRATION_MS:604800000}

# ========================
# OAuth2 - Google
# ========================
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:your-google-client-id}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:your-google-client-secret}
spring.security.oauth2.client.registration.google.scope=email,profile
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/api/v1/auth/oauth2/callback/{registrationId}

# ========================
# OAuth2 - Facebook
# ========================
spring.security.oauth2.client.registration.facebook.client-id=${FACEBOOK_CLIENT_ID:your-facebook-app-id}
spring.security.oauth2.client.registration.facebook.client-secret=${FACEBOOK_CLIENT_SECRET:your-facebook-app-secret}
spring.security.oauth2.client.registration.facebook.scope=email,public_profile
spring.security.oauth2.client.registration.facebook.redirect-uri={baseUrl}/api/v1/auth/oauth2/callback/{registrationId}

# ========================
# Actuator
# ========================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

# ========================
# Logging
# ========================
logging.file.path=logs
logging.level.root=INFO


# ========================
# Frontend redirect after OAuth2
# ========================
app.oauth2.authorized-redirect-uri=${FRONTEND_URL:http://localhost:3000}/oauth2/redirect

# ========================
# Security - Brute force protection
# ========================
app.security.max-login-attempts=5
app.security.lock-duration-minutes=15

# ========================
# Internal Service Secret
# Gateway inject X-Internal-Secret header vào mọi request.
# Service từ chối request không có header này.
# Nếu để trống → bỏ qua kiểm tra (local dev không qua Docker).
# ========================
internal.secret=${INTERNAL_SECRET:}

# ========================
# SpringDoc OpenAPI
# ========================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
# Disable swagger-ui on individual service (only accessible via gateway aggregation)
# Set to true to enable direct access when running locally without gateway
springdoc.swagger-ui.enabled=true
