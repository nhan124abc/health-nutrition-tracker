spring.application.name=ai
server.port=8087

spring.ai.model.chat=openai
spring.ai.openai.api-key=${GROQ_API_KEY:}
spring.ai.openai.base-url=${AI_BASE_URL:https://api.groq.com/openai}
spring.ai.openai.chat.options.model=${AI_MODEL:llama-3.1-8b-instant}
spring.ai.openai.chat.options.temperature=${AI_TEMPERATURE:0.5}

spring.datasource.url=jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:ai_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:secret}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

ai.limits.guest-daily=${AI_GUEST_DAILY_LIMIT:5}
ai.limits.user-daily=${AI_USER_DAILY_LIMIT:50}

management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=when-authorized

logging.file.path=logs
logging.level.root=INFO

internal.secret=${INTERNAL_SECRET:}
services.nutrition.url=${NUTRITION_SERVICE_URL:http://localhost:8083}

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true
